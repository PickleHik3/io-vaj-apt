name: Publish APT wave

# Central publish job. Build machines hand debs off as assets on a
# `staging-*` prerelease; this workflow (the only holder of the GPG key and
# R2 write credentials) stages them into the pool, regenerates + signs the
# metadata, and uploads to Cloudflare R2.
#
# Required repository secrets:
#   VAJ_GPG_PRIVATE_KEY_B64  base64 of the armored EDDSA archive private key
#   VAJ_SIGNING_PASSPHRASE   archive signing passphrase
#   AWS_ACCESS_KEY_ID        R2 S3 access key
#   AWS_SECRET_ACCESS_KEY    R2 S3 secret key
#   R2_S3_ENDPOINT           e.g. https://<account>.r2.cloudflarestorage.com
#   R2_BUCKET                R2 bucket name (root mirrors repo root)

on:
  release:
    # `published`, not `prereleased`: `gh release create` with assets makes a
    # draft first and publishes it once the uploads finish, and GitHub does
    # not fire `prereleased` for a draft that becomes a pre-release -- only
    # `published`. The `if:` below still restricts this to staging-* tags.
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "staging-* release tag whose .deb assets to publish"
        required: true

# Never let two publishes race the pool/manifest.
concurrency:
  group: vaj-apt-publish
  cancel-in-progress: false

permissions:
  contents: write   # download release assets, delete staging release, push manifest

jobs:
  publish:
    # Only staging-* prereleases (or manual dispatch) trigger a publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'staging-')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: auto
      AWS_DEFAULT_REGION: auto
      R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: io-vaj-package   # trunk + default branch; avoids detached HEAD on release event

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install apt tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

      - name: Check required secrets
        run: |
          missing=()
          [ -n "${{ secrets.VAJ_GPG_PRIVATE_KEY_B64 }}" ] || missing+=(VAJ_GPG_PRIVATE_KEY_B64)
          [ -n "${{ secrets.VAJ_SIGNING_PASSPHRASE }}" ] || missing+=(VAJ_SIGNING_PASSPHRASE)
          [ -n "$AWS_ACCESS_KEY_ID" ]     || missing+=(AWS_ACCESS_KEY_ID)
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=(AWS_SECRET_ACCESS_KEY)
          [ -n "$R2_S3_ENDPOINT" ]        || missing+=(R2_S3_ENDPOINT)
          [ -n "$R2_BUCKET" ]             || missing+=(R2_BUCKET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::repository secrets not set: ${missing[*]} -- see the header of this workflow"
            exit 1
          fi

      - name: Import signing key
        run: |
          export GNUPGHOME="$(mktemp -d)"   # export: the import below must land here, not in ~/.gnupg
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "${{ secrets.VAJ_GPG_PRIVATE_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/archive-key.asc"
          gpg --batch --import "$RUNNER_TEMP/archive-key.asc"
          rm -f "$RUNNER_TEMP/archive-key.asc"
          umask 077
          printf '%s' "${{ secrets.VAJ_SIGNING_PASSPHRASE }}" > "$RUNNER_TEMP/pass.txt"
          echo "VAJ_SIGNING_PASSPHRASE_FILE=$RUNNER_TEMP/pass.txt" >> "$GITHUB_ENV"

      - name: Download wave debs from staging release
        run: |
          mkdir -p incoming
          gh release download "$TAG" --dir incoming --pattern '*.deb'
          echo "Downloaded $(ls incoming/*.deb | wc -l) .deb files"
        env:
          GH_TOKEN: ${{ github.token }}

      # A deb that carries another package's files is uninstallable (dpkg
      # refuses the conflict) and poisons the pool for everyone. 279 of the
      # first 1,656 published debs were contaminated this way by the old
      # concurrent-prefix build queue; audit before anything reaches R2.
      # Runs before the ~5 GB pool sync so a bad wave is rejected cheaply.
      # A deb that carries another package's files is uninstallable (dpkg
      # refuses the conflict) and poisons the pool for everyone. 279 of the
      # first 1,656 published debs were contaminated this way by the old
      # concurrent-prefix build queue; audit before anything reaches R2.
      # Runs before the ~5 GB pool sync so a bad deb is caught cheaply.
      #
      # Quarantine rather than reject the wave: the first real firing held up
      # 25 clean debs behind one bad faust. The clean ones publish, the dirty
      # ones are set aside, and the job still ends red (see "Fail if anything
      # was quarantined") so the staging release survives for re-dispatch.
      - name: Audit wave debs for foreign files
        id: audit
        run: |
          rc=0
          python3 scripts/audit-deb-contents.py incoming \
            --contents "$RUNNER_TEMP/Contents-aarch64.gz" --tsv "$RUNNER_TEMP/dirty.tsv" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::error::audit could not run (upstream Contents index unreachable?)"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "quarantined=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p quarantine
          while IFS="$(printf '\t')" read -r name foreign total owners; do
            [ -n "$name" ] || continue
            for f in incoming/*.deb; do
              [ -e "$f" ] || continue
              if [ "$(dpkg-deb -f "$f" Package)" = "$name" ]; then
                mv "$f" quarantine/
                echo "quarantined $name ($foreign/$total foreign files: $owners)"
                break
              fi
            done
          done < "$RUNNER_TEMP/dirty.tsv"
          n_bad=$(ls -1 quarantine/*.deb 2>/dev/null | wc -l)
          n_left=$(ls -1 incoming/*.deb 2>/dev/null | wc -l)
          echo "quarantined=$n_bad" >> "$GITHUB_OUTPUT"
          {
            echo "### $n_bad deb(s) quarantined: they carry another package's files"
            echo
            echo "| package | foreign files | total | top upstream owners |"
            echo "|---|---:|---:|---|"
            awk -F"\t" '{printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4}' "$RUNNER_TEMP/dirty.tsv"
            echo
            echo "The other $n_left deb(s) in this wave were published normally."
            echo "Fix these recipes, then re-dispatch \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::$n_bad deb(s) quarantined; $n_left published"
          if [ "$n_left" -eq 0 ]; then
            echo "::error::every deb in $TAG is contaminated; nothing to publish"
            exit 1
          fi

      - name: Sync pool from R2
        run: |
          # Source of truth for pool objects; needed so generate_repo can read
          # every manifest-selected .deb (it is manifest-authoritative).
          # ~5 GB over a hosted runner: a single object occasionally fails
          # with "Max Retries Exceeded". sync is idempotent and resumes, so
          # retry the whole command a few times with adaptive SDK retries.
          export AWS_RETRY_MODE=adaptive AWS_MAX_ATTEMPTS=10
          for attempt in 1 2 3 4; do
            if aws s3 sync "s3://${R2_BUCKET}/pool" pool \
                 --endpoint-url "$R2_S3_ENDPOINT" --only-show-errors; then
              break
            fi
            [ "$attempt" -lt 4 ] || { echo "::error::pool sync failed after $attempt attempts"; exit 1; }
            echo "pool sync attempt $attempt failed; retrying in 30s"; sleep 30
          done
          echo "Pool now holds $(find pool -name '*.deb' | wc -l) .deb objects"

      - name: Stage debs + append manifest
        id: stage
        run: |
          out="$(python3 scripts/stage-debs.py incoming)"
          echo "$out"
          n="$(echo "$out" | sed -n 's/^STAGED=//p' | tail -1)"
          echo "staged=${n:-0}" >> "$GITHUB_OUTPUT"

      - name: Generate metadata
        if: steps.stage.outputs.staged != '0'
        run: python3 scripts/generate_repo.py

      - name: Sign Release
        if: steps.stage.outputs.staged != '0'
        run: ./scripts/sign-release.sh

      - name: Publish to R2
        if: steps.stage.outputs.staged != '0'
        run: python3 scripts/publish-r2.py --all

      - name: Verify cache policy on mutable metadata
        if: steps.stage.outputs.staged != '0'
        run: python3 scripts/publish-r2.py --verify

      - name: Commit updated manifest
        if: steps.stage.outputs.staged != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/foundation.tsv
          git commit -m "Publish wave from ${TAG} (+${{ steps.stage.outputs.staged }} packages)"
          # Anything pushed to the branch during the ~20 min run (docs, script
          # fixes) makes a plain push non-fast-forward. Only this job edits the
          # manifest, so rebasing onto the current tip is conflict-free.
          for attempt in 1 2 3; do
            git fetch origin io-vaj-package
            git rebase origin/io-vaj-package
            git push origin HEAD:io-vaj-package && break
            [ "$attempt" -lt 3 ] || { echo "::error::manifest push failed after $attempt attempts"; exit 1; }
            sleep 10
          done

      # Last, so the clean debs above are already published. Failing here
      # keeps the staging release (see below), which is the standing to-do
      # marker for the quarantined packages.
      - name: Fail if anything was quarantined
        if: steps.audit.outputs.quarantined != '0'
        run: |
          echo "::error::${{ steps.audit.outputs.quarantined }} deb(s) in $TAG carry another package's files and were not published"
          exit 1

      # Only after everything above succeeded: a failed run must leave the
      # staging release in place so it can be re-dispatched once the cause
      # is fixed, instead of silently discarding a build machine's work.
      - name: Delete staging release
        run: gh release delete "$TAG" --cleanup-tag -y || true
        env:
          GH_TOKEN: ${{ github.token }}
